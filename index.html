<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Roster">
<meta name="theme-color" content="#f5f7fa">
<title>Roster Manager</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f7fa;--bg2:#fff;--bg3:#eef1f6;
  --border:#dde2ec;--border2:#c8d0e0;
  --text:#1a1f36;--text2:#4a5170;--text3:#8890aa;
  --accent:#3b5bdb;--accent2:#2f4ac7;
  --green:#16a34a;--green2:#15803d;
  --r:10px;--rl:16px;
  --ui:'Inter',sans-serif;--mono:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--ui)}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px}

/* CARD */
.card{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--rl);
  padding:40px 36px;
  width:100%;max-width:460px;
  box-shadow:0 4px 24px rgba(0,0,0,.07);
  text-align:center;
}

/* LOGO */
.logo-wrap{margin-bottom:28px}
.logo-icon{
  font-size:36px;margin-bottom:10px;
  display:block;
  filter:drop-shadow(0 2px 4px rgba(59,91,219,.2));
}
.logo{font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--accent)}
.sub{font-size:12px;color:var(--text3);font-family:var(--mono);margin-top:4px}

/* DIVIDER */
.divider{
  height:1px;background:var(--border);
  margin:28px 0;
}

/* BUTTONS */
.btn-group{display:flex;flex-direction:column;gap:12px}

.portal-btn{
  display:flex;align-items:center;gap:16px;
  padding:18px 20px;
  border-radius:var(--rl);
  border:1.5px solid var(--border2);
  background:var(--bg2);
  text-decoration:none;
  cursor:pointer;
  transition:all .18s;
  text-align:left;
}
.portal-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(0,0,0,.1);
}

.portal-btn.admin{
  border-color:#c7d2fe;
  background:linear-gradient(135deg,#eef2ff 0%,#fff 100%);
}
.portal-btn.admin:hover{
  border-color:var(--accent);
  background:linear-gradient(135deg,#e0e7ff 0%,#f5f7fa 100%);
  box-shadow:0 6px 20px rgba(59,91,219,.15);
}

.portal-btn.viewer{
  border-color:#bbf7d0;
  background:linear-gradient(135deg,#f0fdf4 0%,#fff 100%);
}
.portal-btn.viewer:hover{
  border-color:var(--green);
  background:linear-gradient(135deg,#dcfce7 0%,#f5f7fa 100%);
  box-shadow:0 6px 20px rgba(22,163,74,.15);
}

.btn-icon{
  width:44px;height:44px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
}
.admin .btn-icon{background:#e0e7ff;}
.viewer .btn-icon{background:#dcfce7;}

.btn-text{flex:1}
.btn-title{
  font-size:15px;font-weight:700;
  display:block;margin-bottom:3px;
}
.admin .btn-title{color:var(--accent)}
.viewer .btn-title{color:var(--green)}
.btn-desc{font-size:12px;color:var(--text3);display:block;line-height:1.4}

.btn-arrow{
  font-size:18px;color:var(--text3);
  flex-shrink:0;transition:transform .18s,color .18s;
}
.portal-btn:hover .btn-arrow{transform:translateX(3px)}
.admin:hover .btn-arrow{color:var(--accent)}
.viewer:hover .btn-arrow{color:var(--green)}

/* FOOTER */
.footer{
  margin-top:28px;
  font-size:11px;color:var(--text3);
  font-family:var(--mono);
  text-align:center;
  line-height:1.7;
}
.footer a{color:var(--text3);text-decoration:none}
.footer a:hover{color:var(--accent)}
</style>
</head>
<body>

<div class="card">
  <div class="logo-wrap">
    <span class="logo-icon">📋</span>
    <div class="logo">ROSTER MANAGER</div>
    <div class="sub">56-DAY SHIFT PLANNER</div>
  </div>

  <div class="divider"></div>

  <div class="btn-group">

    <a href="roster-admin.html" class="portal-btn admin">
      <div class="btn-icon">🔐</div>
      <div class="btn-text">
        <span class="btn-title">Admin</span>
        <span class="btn-desc">Edit shifts, manage users, sectors and units.<br>Login required.</span>
      </div>
      <span class="btn-arrow">→</span>
    </a>

    <a href="roster-viewer.html" class="portal-btn viewer">
      <div class="btn-icon">👁️</div>
      <div class="btn-text">
        <span class="btn-title">View Roster</span>
        <span class="btn-desc">See the full 56-day schedule.<br>No login needed.</span>
      </div>
      <span class="btn-arrow">→</span>
    </a>

  </div>

  <div class="divider"></div>

  <div class="footer">
    Type your name in the viewer to highlight your shifts<br>
    <a href="README.md">Documentation</a>
  </div>
</div>

</body>
</html>
