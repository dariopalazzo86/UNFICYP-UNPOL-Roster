<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Roster — Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f7fa;--bg2:#fff;--bg3:#eef1f6;
  --border:#dde2ec;--border2:#c8d0e0;
  --text:#1a1f36;--text2:#4a5170;--text3:#8890aa;
  --accent:#3b5bdb;--accent2:#2f4ac7;
  --r:7px;--rl:11px;
  --ui:'Inter',sans-serif;--mono:'DM Mono',monospace;
  --sh:0 1px 4px rgba(0,0,0,.08);
  --d-bg:#dbeafe;--d-t:#1e40af;--d-b:#93c5fd;
  --a-bg:#dcfce7;--a-t:#166534;--a-b:#86efac;
  --rd-bg:#fef9c3;--rd-t:#854d0e;--rd-b:#fde047;
  --al-bg:#fce7f3;--al-t:#9d174d;--al-b:#f9a8d4;
  --of-bg:#f8fafc;--of-t:#94a3b8;--of-b:#e2e8f0;
  --we:#f1f5f9;
  --sbg:#ede9fe;--st:#5b21b6;--sb:#c4b5fd;
  --stbg:#e0f2fe;--stt:#075985;--stb:#7dd3fc;
  --ubg:#fef3c7;--ut:#92400e;--ub:#fcd34d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--ui)}
body{display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:11px 20px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:60;box-shadow:var(--sh);flex-wrap:wrap}
.logo{font-size:16px;font-weight:700;color:var(--accent);letter-spacing:-.3px}
.sub{font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:1px}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rbadge{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:700;letter-spacing:.5px;background:#16a34a;color:#fff}
.upd{font-size:11px;font-family:var(--mono);color:var(--text3);display:flex;align-items:center;gap:5px}
.udot{width:7px;height:7px;border-radius:50%;background:#16a34a;flex-shrink:0}
/* SETUP BANNER */
.setup-banner{background:#eff6ff;border-bottom:2px solid #bfdbfe;padding:14px 20px;font-size:13px;color:var(--text2)}
.setup-banner h2{font-size:15px;font-weight:700;color:var(--accent);margin-bottom:10px}
.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
@media(max-width:600px){.setup-grid{grid-template-columns:1fr}}
.setup-field{display:flex;flex-direction:column;gap:4px}
.setup-field label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.4px}
.setup-field input{font-size:13px;padding:8px 10px;border-radius:var(--r);border:1px solid var(--border2);background:#fff;color:var(--text);outline:none;font-family:var(--mono)}
.setup-field input:focus{border-color:var(--accent)}
.setup-hint{font-size:11px;color:var(--text3);margin-top:2px}
.setup-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.setup-status{font-size:12px;font-family:var(--mono);color:var(--text3)}
main{flex:1;padding:14px 20px;overflow:visible}
.toolbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:11px;padding:9px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--sh)}
.ccard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:14px;box-shadow:var(--sh)}
input[type=text],select{font-size:12px;font-family:var(--ui);padding:5px 8px;border-radius:var(--r);border:1px solid var(--border2);background:#fff;color:var(--text);outline:none;transition:border-color .15s}
input[type=text]:focus,select:focus{border-color:var(--accent)}
input::placeholder{color:var(--text3)}
label{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:5px}
.btn{font-size:12px;font-family:var(--ui);font-weight:600;padding:5px 11px;border-radius:var(--r);border:1px solid var(--border2);background:#fff;color:var(--text2);cursor:pointer;white-space:nowrap;transition:all .12s}
.btn:hover{background:var(--bg3);color:var(--text)}
.btn.acc{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.acc:hover{background:var(--accent2)}
.btn.sm{font-size:11px;padding:3px 8px}
.mybanner{display:none;margin-bottom:10px;padding:10px 14px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:var(--rl);font-size:12px;color:var(--text2);gap:10px;align-items:center;flex-wrap:wrap}
.mybanner.show{display:flex}
.stats{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;align-items:center}
@media(max-width:820px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;box-shadow:var(--sh);display:flex;align-items:center;gap:5px;white-space:nowrap}
.slbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.sval{font-size:13px;font-weight:700;font-family:var(--mono)}
.legend{display:flex;gap:10px;font-size:11px;color:var(--text3);margin-bottom:8px;flex-wrap:wrap;align-items:center;font-family:var(--mono)}
.lsq{width:13px;height:13px;border-radius:3px;display:inline-block;vertical-align:-3px;margin-right:3px;border:1px solid rgba(0,0,0,.1)}
.twrap{display:block;overflow-x:auto;overflow-y:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:var(--rl);max-height:calc(100vh - 310px);background:var(--bg2);box-shadow:var(--sh)}
table{border-collapse:collapse;min-width:100%;font-size:11px;font-family:var(--mono)}
thead th{position:sticky;top:0;background:#f8f9fc;z-index:10;padding:6px 3px;border-bottom:1px solid var(--border2);font-weight:600;text-align:center;white-space:nowrap;color:var(--text2)}
thead th.uc{left:0;z-index:22;text-align:left;padding-left:10px;min-width:140px;font-family:var(--ui);font-size:11px;background:#f8f9fc}
thead th.ic{left:140px;z-index:21;min-width:78px;background:#f8f9fc}
thead th.we{background:#f0f4f8!important;color:var(--text3)}
tbody th.uc{position:sticky;left:0;z-index:6;background:var(--bg2);padding:4px 10px;border-right:1px solid var(--border);font-weight:500;white-space:nowrap;min-width:140px;font-family:var(--ui);font-size:11px;color:var(--text)}
tbody td.ic{position:sticky;left:140px;z-index:5;background:var(--bg2);border-right:1px solid var(--border);padding:3px 4px;min-width:78px;cursor:default}
tbody tr:hover th.uc,tbody tr:hover td.ic{background:#eff3ff}
tbody tr.myrow th.uc{color:var(--accent);font-weight:700}
tbody tr.myrow td,tbody tr.myrow th.uc,tbody tr.myrow td.ic{background:#eff6ff!important}
tbody tr.myrow{outline:1px solid #bfdbfe}
td{border:1px solid var(--border);text-align:center;cursor:default;min-width:46px;vertical-align:middle}
td.sd{background:var(--d-bg);color:var(--d-t);font-weight:600}
td.sa{background:var(--a-bg);color:var(--a-t);font-weight:600}
td.srd{background:var(--rd-bg);color:var(--rd-t);font-weight:600}
td.sal{background:var(--al-bg);color:var(--al-t);font-weight:600}
td.sof{background:var(--of-bg);color:var(--of-t)}
td.we{background:var(--we)!important}
td.sd.we{background:#bfdbfe!important}
td.sa.we{background:#bbf7d0!important}
td.srd.we{background:#fef08a!important}
td.sal.we{background:#fbcfe8!important}
.dhdr-num{display:block;font-size:11px;font-weight:700;color:var(--text);line-height:1.2}
.dhdr-date{display:block;font-size:9px;color:var(--text3);font-family:var(--ui);white-space:nowrap;line-height:1.2}
thead th.we .dhdr-num,thead th.we .dhdr-date{color:var(--text3)}
.cell-shift{display:block;font-size:11px;font-weight:700;line-height:1.3}
.cell-date{display:block;font-size:9px;font-family:var(--ui);opacity:.75;line-height:1.2;white-space:nowrap}
.badge{display:inline-block;font-size:9px;font-family:var(--mono);padding:1px 5px;border-radius:4px;font-weight:500;white-space:nowrap}
.bsec{background:var(--sbg);color:var(--st);border:1px solid var(--sb)}
.bsta{background:var(--stbg);color:var(--stt);border:1px solid var(--stb)}
.buni{background:var(--ubg);color:var(--ut);border:1px solid var(--ub)}
.bnat{background:#fdf2f8;color:#86198f;border:1px solid #f0abfc}
.mrow{display:flex;gap:2px;flex-wrap:wrap}
.nodata{display:none;text-align:center;padding:60px 20px;color:var(--text3);font-family:var(--mono);font-size:13px}
.nodata.show{display:block}
.nodata .ico{font-size:40px;margin-bottom:14px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg3)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}
.sw{position:relative;display:flex;align-items:center}
.sw input{padding-left:26px}
.si{position:absolute;left:8px;color:var(--text3);font-size:12px;pointer-events:none}
code{background:var(--bg3);padding:1px 5px;border-radius:3px;font-family:var(--mono);font-size:12px}
</style>
</head>
<body>


<header>
  <div>
    <div class="logo">UNFICYP UNPOL ROSTER MANAGER</div>
    <div class="sub" id="repoLabel">56-day shift planner</div>
  </div>
  <div class="hright">
    <div class="upd"><span class="udot"></span><span id="updlbl">Loading…</span></div>
    <button class="btn sm acc" onclick="loadAndRender()">↻ Refresh</button>
    <span class="rbadge">VIEW ONLY</span>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="sw"><span class="si">🔍</span><input type="text" id="srch" placeholder="Search IPO…" style="width:130px" oninput="buildBody()"></div>
    <select id="fSec" onchange="cascadeFilters();buildBody()"><option value="">All sectors</option></select>
    <select id="fSta" onchange="cascadeFilters();buildBody()"><option value="">All stations</option></select>
    <select id="fUni" onchange="buildBody()"><option value="">All units</option></select>
    <select id="fNat" onchange="buildBody()"><option value="">All nationalities</option></select>
    <select id="fShift" onchange="buildBody()"><option value="">All shifts</option></select>
    <label style="margin-left:auto">My name:
      <input type="text" id="myname" placeholder="Type your name…" style="width:155px" oninput="buildBody()">
    </label>
  </div>

  <div class="mybanner" id="mybanner"></div>

  <div class="legend" id="shiftLegend"><!-- populated dynamically --></div>

  <div class="stats" id="statsBar"><!-- populated dynamically --></div>

  <div class="nodata" id="nodata">
    <div class="ico">📋</div>
    <strong>No data loaded yet.</strong><br><br>
    Fill in the setup above with your GitHub details, then click <strong>Save &amp; Load</strong>.
  </div>

  <div class="twrap" id="twrap" style="display:none">
    <table><thead id="rHead"></thead><tbody id="rBody"></tbody></table>
  </div>

  <!-- EXPORT CARD -->
  <div class="ccard" style="margin-top:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px">
    <span style="font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap">📤 Export</span>
    <label style="font-size:11px;color:var(--text2);display:flex;align-items:center;gap:5px">From <input type="date" id="exportFrom" style="font-size:11px;padding:4px 6px;border-color:#c7d2fe"></label>
    <label style="font-size:11px;color:var(--text2);display:flex;align-items:center;gap:5px">To <input type="date" id="exportTo" style="font-size:11px;padding:4px 6px;border-color:#c7d2fe"></label>
    <button class="btn sm acc" onclick="exportCSV()" title="Export filtered view to CSV">⬇ CSV</button>
    <button class="btn sm acc" onclick="exportImage()" title="Export filtered view as PNG">🖼 PNG</button>
    <span id="exportRangeInfo" style="font-size:10px;color:var(--text3);font-family:var(--mono)"></span>
  </div>
</main>

<script>
const DAYS=56;
const OFF_DEF={key:'OFF',label:'',name:'Off / Clear',bg:'#f8fafc',fg:'#94a3b8',border:'#e2e8f0'};
let shiftDefs=[
  {key:'D', label:'D', name:'Day',         bg:'#dbeafe',fg:'#1e40af',border:'#93c5fd'},
  {key:'A', label:'A', name:'Afternoon',   bg:'#dcfce7',fg:'#166534',border:'#86efac'},
  {key:'RD',label:'RD',name:'Rest Day',    bg:'#fef9c3',fg:'#854d0e',border:'#fde047'},
  {key:'AL',label:'AL',name:'Annual Leave',bg:'#fce7f3',fg:'#9d174d',border:'#f9a8d4'},
];
function rebuildShiftLookups(){
  window._CLS=Object.fromEntries([...shiftDefs.map(s=>[s.key,'sc_'+s.key]),['OFF','sc_OFF']]);
  window._LBL=Object.fromEntries([...shiftDefs.map(s=>[s.key,s.label]),['OFF','']]);
  window._NAME=Object.fromEntries([...shiftDefs.map(s=>[s.key,s.name]),['OFF','Off / Clear']]);
  let el=document.getElementById('vShiftStyles');
  if(!el){el=document.createElement('style');el.id='vShiftStyles';document.head.appendChild(el);}
  el.textContent=[...shiftDefs,OFF_DEF].map(s=>`
    td.sc_${s.key}{background:${s.bg};color:${s.fg};font-weight:600}
    td.sc_${s.key}.we{background:${s.bg}cc!important}
  `).join('')+`td.sc_OFF{background:${OFF_DEF.bg};color:${OFF_DEF.fg};font-weight:400}`;
}
rebuildShiftLookups();
const NATIONALITIES = ['Afghanistan','Albania','Algeria','Andorra','Angola','Antigua and Barbuda','Argentina','Armenia','Australia','Austria','Azerbaijan','Bahamas','Bahrain','Bangladesh','Barbados','Belarus','Belgium','Belize','Benin','Bhutan','Bolivia','Bosnia and Herzegovina','Botswana','Brazil','Brunei','Bulgaria','Burkina Faso','Burundi','Cabo Verde','Cambodia','Cameroon','Canada','Central African Republic','Chad','Chile','China','Colombia','Comoros','Congo','Costa Rica','Croatia','Cuba','Cyprus','Czech Republic','Denmark','Djibouti','Dominica','Dominican Republic','Ecuador','Egypt','El Salvador','Equatorial Guinea','Eritrea','Estonia','Eswatini','Ethiopia','Fiji','Finland','France','Gabon','Gambia','Georgia','Germany','Ghana','Greece','Grenada','Guatemala','Guinea','Guinea-Bissau','Guyana','Haiti','Honduras','Hungary','Iceland','India','Indonesia','Iran','Iraq','Ireland','Israel','Italy','Jamaica','Japan','Jordan','Kazakhstan','Kenya','Kiribati','Kuwait','Kyrgyzstan','Laos','Latvia','Lebanon','Lesotho','Liberia','Libya','Liechtenstein','Lithuania','Luxembourg','Madagascar','Malawi','Malaysia','Maldives','Mali','Malta','Marshall Islands','Mauritania','Mauritius','Mexico','Micronesia','Moldova','Monaco','Mongolia','Montenegro','Morocco','Mozambique','Myanmar','Namibia','Nauru','Nepal','Netherlands','New Zealand','Nicaragua','Niger','Nigeria','North Korea','North Macedonia','Norway','Oman','Pakistan','Palau','Palestine','Panama','Papua New Guinea','Paraguay','Peru','Philippines','Poland','Portugal','Qatar','Romania','Russia','Rwanda','Saint Kitts and Nevis','Saint Lucia','Saint Vincent and the Grenadines','Samoa','San Marino','Sao Tome and Principe','Saudi Arabia','Senegal','Serbia','Seychelles','Sierra Leone','Singapore','Slovakia','Slovenia','Solomon Islands','Somalia','South Africa','South Korea','South Sudan','Spain','Sri Lanka','Sudan','Suriname','Sweden','Switzerland','Syria','Taiwan','Tajikistan','Tanzania','Thailand','Timor-Leste','Togo','Tonga','Trinidad and Tobago','Tunisia','Turkey','Turkmenistan','Tuvalu','Uganda','Ukraine','United Arab Emirates','United Kingdom','United States','Uruguay','Uzbekistan','Vanuatu','Vatican City','Venezuela','Vietnam','Yemen','Zambia','Zimbabwe'].sort();

let users=[], roster={}, sectors=[], stations=[], units=[];
let startDate=new Date();
let appConfig=null;

async function fetchConfig(){
  try{
    const r=await fetch('./config.json?t='+Date.now());
    if(r.ok){ appConfig=await r.json(); return true; }
  }catch(e){}
  return false;
}

function rawUrl(){
  if(!appConfig) return null;
  return `https://raw.githubusercontent.com/${appConfig.owner}/${appConfig.repo}/${appConfig.branch||'main'}/${appConfig.dataPath||'roster-data.json'}`;
}

async function loadAndRender(){
  if(!appConfig){
    const ok=await fetchConfig();
    if(!ok||!appConfig){
      document.getElementById('nodata').classList.add('show');
      document.getElementById('twrap').style.display='none';
      document.getElementById('updlbl').textContent='Error: config.json not found';
      document.getElementById('nodata').innerHTML=
        `<div class="ico">⚠️</div><strong>Could not load config.json.</strong><br><br>`+
        `Make sure config.json is in your repo root and the site is deployed on GitHub Pages.`;
      return;
    }
  }
  document.getElementById('updlbl').textContent='Loading…';
  document.getElementById('repoLabel').textContent=
    (appConfig.owner||'?')+'/'+(appConfig.repo||'?')+' · '+(appConfig.dataPath||'roster-data.json');
  try{
    const r=await fetch(rawUrl()+'?t='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status+(r.status===404?' — admin has not saved yet':''));
    const p=await r.json();
    sectors=p.sectors||[]; stations=p.stations||[];
    units=p.units||[]; users=p.users||[]; roster=p.roster||{};
    if(p.shiftDefs&&p.shiftDefs.length){shiftDefs=p.shiftDefs;rebuildShiftLookups();}
    if(p.startDate) startDate=new Date(p.startDate);
    if(p.savedAt){      const d=new Date(p.savedAt);
      document.getElementById('updlbl').textContent=
        'Updated '+d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+
        ' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    }
    document.getElementById('nodata').classList.remove('show');
    document.getElementById('twrap').style.display='';
    populateSelects(); buildViewerShiftUI(); buildHead(); buildBody();
    initExportRange();
  }catch(e){
    document.getElementById('nodata').classList.add('show');
    document.getElementById('twrap').style.display='none';
    document.getElementById('updlbl').textContent='Error: '+e.message;
    document.getElementById('nodata').innerHTML=
      `<div class="ico">⚠️</div><strong>Could not load roster data.</strong><br><br>${esc(e.message)}<br><br>`+
      `Make sure the repository is <strong>public</strong> and the admin has saved at least once.`;
  }
}


function populateSelects(){
  // sector — always full list
  const fSec=document.getElementById('fSec');
  if(fSec){
    const cur=fSec.value;
    fSec.innerHTML='<option value="">All sectors</option>'
      +sectors.map(v=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(v)}</option>`).join('');
  }
  cascadeFilters();
  // nationality — only used
  const fNat=document.getElementById('fNat');
  if(fNat){
    const cur=fNat.value;
    const usedNats=[...new Set(users.map(u=>u.nationality).filter(Boolean))].sort();
    fNat.innerHTML='<option value="">All nationalities'+(usedNats.length?` (${usedNats.length})`:'')+'</option>'
      +usedNats.map(n=>`<option value="${esc(n)}"${n===cur?' selected':''}>${esc(n)}</option>`).join('');
  }
}

function cascadeFilters(){
  const selSec=document.getElementById('fSec')?.value||'';
  const selSta=document.getElementById('fSta')?.value||'';

  // stations filtered by sector
  const availStations=[...new Set(
    users.filter(u=>!selSec||u.sector===selSec).map(u=>u.station).filter(Boolean)
  )].sort();
  const staEl=document.getElementById('fSta');
  if(staEl){
    const curSta=availStations.includes(staEl.value)?staEl.value:'';
    staEl.innerHTML='<option value="">All stations</option>'
      +availStations.map(v=>`<option value="${esc(v)}"${v===curSta?' selected':''}>${esc(v)}</option>`).join('');
  }

  // units filtered by sector + station
  const availUnits=[...new Set(
    users.filter(u=>(!selSec||u.sector===selSec)&&(!selSta||u.station===selSta))
         .map(u=>u.unit).filter(Boolean)
  )].sort();
  const uniEl=document.getElementById('fUni');
  if(uniEl){
    const curUni=availUnits.includes(uniEl.value)?uniEl.value:'';
    uniEl.innerHTML='<option value="">All units</option>'
      +availUnits.map(v=>`<option value="${esc(v)}"${v===curUni?' selected':''}>${esc(v)}</option>`).join('');
  }
}

function buildHead(){
  const base=new Date(startDate);
  let h='<tr><th class="uc">User</th>'
    +'<th class="ic" style="position:sticky;left:140px;z-index:21;background:#f8f9fc;min-width:78px;text-align:center">Info</th>';
  for(let i=0;i<DAYS;i++){
    const d=new Date(base);d.setDate(base.getDate()+i);
    const we=d.getDay()===0||d.getDay()===6;
    const dateStr=d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
    h+=`<th class="${we?'we':''}" title="${dateStr}">`
      +`<span class="dhdr-num">${i+1}</span>`
      +`<span class="dhdr-date">${dateStr}</span>`
      +`</th>`;
  }
  document.getElementById('rHead').innerHTML=h+'</tr>';
}

function filtered(){
  const s=document.getElementById('srch').value.toLowerCase();
  const fsc=document.getElementById('fSec').value;
  const fst=document.getElementById('fSta').value;
  const fun=document.getElementById('fUni').value;
  const fnat=document.getElementById('fNat').value;
  const fsh=document.getElementById('fShift').value;
  return users.filter(u=>{
    if(s&&!u.name.toLowerCase().includes(s))return false;
    if(fsc&&u.sector!==fsc)return false;
    if(fst&&u.station!==fst)return false;
    if(fun&&u.unit!==fun)return false;
    if(fnat&&u.nationality!==fnat)return false;
    if(fsh&&!(roster[u.id]||[]).some(x=>x===fsh))return false;
    return true;
  });
}

function buildBody(){
  const base=new Date(startDate);
  const myname=document.getElementById('myname').value.trim().toLowerCase();
  const list=filtered();
  let h='';
  list.forEach(u=>{
    const isMe=myname&&u.name.toLowerCase().includes(myname);
    h+=`<tr${isMe?' class="myrow"':''}>`
      +`<th class="uc">${esc(u.name)}</th>`
      +`<td class="ic"><div class="mrow">`
      +(u.nationality?`<span class="badge bnat">🌐 ${esc(u.nationality)}</span>`:'')
      +(u.sector?`<span class="badge bsec">${esc(u.sector)}</span>`:'')
      +(u.station?`<span class="badge bsta">${esc(u.station)}</span>`:'')
      +(u.unit?`<span class="badge buni">${esc(u.unit)}</span>`:'')
      +`</div></td>`;
    const shifts=roster[u.id]||Array(DAYS).fill('OFF');
    for(let i=0;i<DAYS;i++){
      const d=new Date(base);d.setDate(base.getDate()+i);
      const we=d.getDay()===0||d.getDay()===6;
      const s=shifts[i]||'OFF';
      const dateStr=d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
      h+=`<td class="${_CLS[s]}${we?' we':''}">`
        +(_LBL[s]?`<span class="cell-shift">${_LBL[s]}</span>`:'')
        +`<span class="cell-date">${dateStr}</span>`
        +`</td>`;
    }
    h+='</tr>';
  });
  document.getElementById('rBody').innerHTML=h;
  updateStats(list); updateMyBanner(myname);
}

function buildViewerShiftUI(){
  // fShift select
  const fShift=document.getElementById('fShift');
  if(fShift){
    const cur=fShift.value;
    fShift.innerHTML='<option value="">All shifts</option>'
      +shiftDefs.map(s=>`<option value="${s.key}"${s.key===cur?' selected':''}>${s.label} — ${esc(s.name)}</option>`).join('')
      +'<option value="OFF">Off / Clear</option>';
  }
  // legend
  const leg=document.getElementById('shiftLegend');
  if(leg) leg.innerHTML=shiftDefs.map(s=>
    `<span><span class="lsq" style="background:${s.bg};border-color:${s.border}"></span>${esc(s.label)} = ${esc(s.name)}</span>`
  ).join('')
  +`<span><span class="lsq" style="background:#f8fafc;border-color:#e2e8f0"></span>Off</span>`
  +`<span style="margin-left:auto;font-size:10px;color:var(--text3)">Read-only · Admin file to make changes</span>`;
  // stats bar — compact pill row
  const sb=document.getElementById('statsBar');
  if(sb) sb.innerHTML=
    `<div class="stat"><span class="slbl">IPOs</span><span class="sval" id="su">—</span></div>`
    +shiftDefs.map(s=>
      `<div class="stat" style="border-color:${s.border}"><span class="slbl">${esc(s.label)}</span><span class="sval" id="stat_${s.key}" style="color:${s.fg}">—</span></div>`
    ).join('')
    ;
}

function updateStats(list){
  const f=list||filtered();
  const counts={};shiftDefs.forEach(s=>{counts[s.key]=0;});
  let tot=0,working=0;
  f.forEach(u=>{(roster[u.id]||[]).forEach(s=>{if(counts[s]!==undefined){counts[s]++;working++;}tot++;});});
  const suEl=document.getElementById('su');if(suEl)suEl.textContent=f.length;
  shiftDefs.forEach(s=>{const el=document.getElementById('stat_'+s.key);if(el)el.textContent=counts[s.key]||0;});
  const cov=document.getElementById('scov');if(cov)cov.textContent=tot?Math.round(working/tot*100)+'%':'0%';
}

function updateMyBanner(myname){
  const banner=document.getElementById('mybanner');
  if(!myname){banner.className='mybanner';return;}
  const me=users.find(u=>u.name.toLowerCase().includes(myname));
  if(!me){banner.className='mybanner';return;}
  const today=new Date();today.setHours(0,0,0,0);
  const base=new Date(startDate);
  const counts={};shiftDefs.forEach(s=>{counts[s.key]=0;});
  let next=null, ofc=0;
  (roster[me.id]||[]).forEach((s,i)=>{
    const d=new Date(base);d.setDate(base.getDate()+i);
    if(d<today)return;
    if(counts[s]!==undefined){
      counts[s]++;
      if(!next){const def=shiftDefs.find(x=>x.key===s);if(def)next={date:d,name:def.name};}
    } else { ofc++; }
  });
  const nxt=next
    ?`Next: <strong>${esc(next.name)}</strong> on <strong>${next.date.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'})}</strong> &nbsp;·&nbsp;`
    :'No upcoming working shifts &nbsp;·&nbsp;';
  const countsStr=shiftDefs.map(s=>`${esc(s.label)}:<strong>${counts[s.key]}</strong>`).join(' &nbsp;');
  banner.innerHTML=`👤 <strong>${esc(me.name)}</strong> &nbsp;·&nbsp; ${nxt}${countsStr} &nbsp;Off:<strong>${ofc}</strong>`;
  banner.className='mybanner show';
}

function getExportRange(){
  const base=new Date(startDate);
  const allDates=Array.from({length:DAYS},(_,i)=>{const d=new Date(base);d.setDate(base.getDate()+i);return d;});
  const fromEl=document.getElementById('exportFrom'), toEl=document.getElementById('exportTo');
  let from=fromEl&&fromEl.value?new Date(fromEl.value):allDates[0];
  let to=toEl&&toEl.value?new Date(toEl.value):allDates[DAYS-1];
  if(from<allDates[0])from=allDates[0];
  if(to>allDates[DAYS-1])to=allDates[DAYS-1];
  if(from>to){from=allDates[0];to=allDates[DAYS-1];}
  const dayIndices=[],dates=[];
  allDates.forEach((d,i)=>{
    const dd=new Date(d);dd.setHours(0,0,0,0);
    const f=new Date(from);f.setHours(0,0,0,0);
    const t=new Date(to);t.setHours(0,0,0,0);
    if(dd>=f&&dd<=t){dayIndices.push(i);dates.push(d);}
  });
  const fmt=d=>d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  const el=document.getElementById('exportRangeInfo');
  if(el)el.textContent=dates.length+' day'+(dates.length!==1?'s':'')+' ('+fmt(from)+' → '+fmt(to)+')';
  return{dayIndices,dates,fromStr:fmt(from),toStr:fmt(to)};
}
function initExportRange(){
  const base=new Date(startDate);
  const last=new Date(base);last.setDate(base.getDate()+DAYS-1);
  const fmt=d=>d.toISOString().slice(0,10);
  const fromEl=document.getElementById('exportFrom'),toEl=document.getElementById('exportTo');
  if(fromEl)fromEl.value=fmt(base);if(toEl)toEl.value=fmt(last);
  const el=document.getElementById('exportRangeInfo');
  const f=base.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  const t=last.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  if(el)el.textContent=DAYS+' days ('+f+' → '+t+')';
}

function exportCSV(){
  const list=filtered();
  if(!list.length){alert('No users match the current filters.');return;}
  const{dayIndices,dates,fromStr,toStr}=getExportRange();
  const fShift=document.getElementById('fShift').value;
  let csv='Name,Nationality,Sector,Station,Unit';
  dayIndices.forEach((di,pos)=>{
    csv+=',Day '+(di+1)+' ('+dates[pos].toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+')';
  });
  csv+='\n';
  list.forEach(u=>{
    const shifts=roster[u.id]||Array(DAYS).fill('OFF');
    csv+=`"${u.name}","${u.nationality||''}","${u.sector||''}","${u.station||''}","${u.unit||''}"`;
    dayIndices.forEach(di=>{csv+=','+(shifts[di]==='OFF'?'Off':(_NAME[shifts[di]]||shifts[di]));});
    csv+='\n';
  });
  const parts=['roster'];
  const secF=document.getElementById('fSec').value,staF=document.getElementById('fSta').value;
  const uniF=document.getElementById('fUni').value,natF=document.getElementById('fNat').value;
  if(secF)parts.push(secF.replace(/\s+/g,'_'));if(staF)parts.push(staF.replace(/\s+/g,'_'));
  if(uniF)parts.push(uniF.replace(/\s+/g,'_'));if(natF)parts.push(natF.replace(/\s+/g,'_'));
  if(fShift)parts.push(fShift);if(list.length!==users.length)parts.push(list.length+'users');
  parts.push(fromStr.replace(/\s/g,'')+'-'+toStr.replace(/\s/g,''));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download=parts.join('_')+'.csv';a.click();
}

function exportImage(){
  const list=filtered();
  if(!list.length){alert('No users match the current filters.');return;}
  const{dayIndices,dates,fromStr,toStr}=getExportRange();
  const nDays=dayIndices.length;
  const SCALE=2,ROW_H=28,HEAD_H=44,NAME_W=160,INFO_W=80,DAY_W=46,PAD=4,TITLE_H=36,LEGEND_H=26;
  const totalW=NAME_W+INFO_W+DAY_W*nDays, totalH=TITLE_H+LEGEND_H+HEAD_H+ROW_H*list.length+2;
  const canvas=document.createElement('canvas');
  canvas.width=totalW*SCALE;canvas.height=totalH*SCALE;
  const ctx=canvas.getContext('2d');ctx.scale(SCALE,SCALE);
  const BORDER='#dde2ec',TEXT='#1a1f36',TEXT2='#4a5170',TEXT3='#8890aa',WE_BG='#f1f5f9',ACCENT='#3b5bdb';
  const fill=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h);};
  const hline=(y,x1=0,x2=totalW)=>{ctx.strokeStyle=BORDER;ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(x1,y-.25);ctx.lineTo(x2,y-.25);ctx.stroke();};
  const vline=(x,y1=0,y2=totalH)=>{ctx.strokeStyle=BORDER;ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(x-.25,y1);ctx.lineTo(x-.25,y2);ctx.stroke();};
  const txt=(s,x,y,{font='12px Inter,sans-serif',color=TEXT,align='left',maxW}={})=>{ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';maxW?ctx.fillText(s,x,y,maxW):ctx.fillText(s,x,y);};
  // title
  fill(0,0,totalW,TITLE_H,ACCENT);
  const tp=['ROSTER'];
  const secF=document.getElementById('fSec').value,staF=document.getElementById('fSta').value;
  const uniF=document.getElementById('fUni').value,natF=document.getElementById('fNat').value;
  const shF=document.getElementById('fShift').value;
  if(secF)tp.push(secF);if(staF)tp.push(staF);if(uniF)tp.push(uniF);if(natF)tp.push(natF);if(shF)tp.push(_NAME[shF]||shF);
  txt(tp.join(' · ')+' — '+fromStr+' → '+toStr+' ('+list.length+' users, '+nDays+' days)',12,TITLE_H/2,{font:'bold 12px Inter,sans-serif',color:'#fff'});
  // legend
  fill(0,TITLE_H,totalW,LEGEND_H,'#eef1f6');hline(TITLE_H+LEGEND_H);
  let lx=10;
  shiftDefs.forEach(s=>{fill(lx,TITLE_H+7,12,12,s.bg);ctx.strokeStyle=s.border;ctx.lineWidth=.5;ctx.strokeRect(lx+.25,TITLE_H+7.25,11.5,11.5);txt(s.label+' = '+s.name,lx+16,TITLE_H+LEGEND_H/2,{font:'10px Inter,sans-serif',color:TEXT2});lx+=ctx.measureText(s.label+' = '+s.name).width+30;});
  fill(lx,TITLE_H+7,12,12,'#f8fafc');ctx.strokeStyle='#e2e8f0';ctx.lineWidth=.5;ctx.strokeRect(lx+.25,TITLE_H+7.25,11.5,11.5);txt('Off',lx+16,TITLE_H+LEGEND_H/2,{font:'10px Inter,sans-serif',color:TEXT3});
  // header
  const hy=TITLE_H+LEGEND_H;fill(0,hy,totalW,HEAD_H,'#f8f9fc');hline(hy+HEAD_H);
  txt('User',PAD+4,hy+HEAD_H/2,{font:'bold 11px Inter,sans-serif',color:TEXT2});
  txt('Info',NAME_W+INFO_W/2,hy+HEAD_H/2,{font:'bold 11px Inter,sans-serif',color:TEXT2,align:'center'});
  dayIndices.forEach((di,pos)=>{
    const d=dates[pos],isWe=d.getDay()===0||d.getDay()===6,cx=NAME_W+INFO_W+pos*DAY_W;
    if(isWe)fill(cx,hy,DAY_W,HEAD_H,WE_BG);
    txt(String(di+1),cx+DAY_W/2,hy+11,{font:'bold 10px Inter,sans-serif',color:isWe?TEXT3:TEXT2,align:'center'});
    txt(d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}),cx+DAY_W/2,hy+27,{font:'9px Inter,sans-serif',color:TEXT3,align:'center'});
    vline(cx,hy,hy+HEAD_H);
  });
  vline(NAME_W,hy,hy+HEAD_H);vline(NAME_W+INFO_W,hy,hy+HEAD_H);
  // rows
  list.forEach((u,ri)=>{
    const ry=TITLE_H+LEGEND_H+HEAD_H+ri*ROW_H,rowBg=ri%2===0?'#ffffff':'#f7f9fc';
    fill(0,ry,totalW,ROW_H,rowBg);
    txt(u.name,PAD+4,ry+ROW_H/2,{font:'500 11px Inter,sans-serif',color:TEXT,maxW:NAME_W-8});
    txt([u.sector,u.station,u.unit].filter(Boolean).join(' · '),NAME_W+4,ry+ROW_H/2,{font:'9px Inter,sans-serif',color:TEXT3,maxW:INFO_W-6});
    const shifts=roster[u.id]||Array(DAYS).fill('OFF');
    dayIndices.forEach((di,pos)=>{
      const d=dates[pos],isWe=d.getDay()===0||d.getDay()===6,s=shifts[di]||'OFF',cx=NAME_W+INFO_W+pos*DAY_W;
      const def=shiftDefs.find(x=>x.key===s);
      fill(cx,ry,DAY_W,ROW_H,def?(isWe?def.bg+'cc':def.bg):(isWe?WE_BG:rowBg));
      if(def)txt(def.label,cx+DAY_W/2,ry+ROW_H/2,{font:'bold 10px "DM Mono",monospace',color:def.fg,align:'center'});
      vline(cx,ry,ry+ROW_H);
    });
    hline(ry+ROW_H);vline(NAME_W,ry,ry+ROW_H);vline(NAME_W+INFO_W,ry,ry+ROW_H);
  });
  ctx.strokeStyle='#c8d0e0';ctx.lineWidth=1;ctx.strokeRect(.5,TITLE_H+.5,totalW-1,totalH-TITLE_H-1);
  const fname=['roster_img'];
  if(secF)fname.push(secF.replace(/\s+/g,'_'));if(natF)fname.push(natF.replace(/\s+/g,'_'));if(shF)fname.push(shF);
  fname.push(fromStr.replace(/\s/g,'')+'-'+toStr.replace(/\s/g,''));
  const link=document.createElement('a');link.download=fname.join('_')+'.png';link.href=canvas.toDataURL('image/png');link.click();
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// pre-fill form and auto-load on start
buildViewerShiftUI();
loadAndRender();
</script>
